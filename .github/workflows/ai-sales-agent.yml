name: AI Sales Agent - Offline

on:
  push:
    branches: ['codex/ai-sales-agent-v1-20261004']
  pull_request:
    paths:
      - 'apps/gateway/src/services/salesAgent/**'
      - 'apps/gateway/src/controllers/salesAgentController.js'
      - 'apps/gateway/src/routes/conversationRoutes.js'
      - '.github/workflows/ai-sales-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-sales-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check focused source syntax
        shell: bash
        run: |
          for file in apps/gateway/src/services/salesAgent/*.mjs apps/gateway/src/controllers/salesAgentController.js apps/gateway/src/routes/conversationRoutes.js; do
            node --check "$file"
          done
      - name: Run isolated tests without provider credentials or dependency installation
        run: node --import ./tests/offline-test-guard.mjs --test apps/gateway/src/services/salesAgent/salesAgent.test.mjs
